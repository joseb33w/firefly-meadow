name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write build env file
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREFLIES_TABLE: ${{ secrets.VITE_FIREFLIES_TABLE }}
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://xhhmxabftbyxrirvvihn.supabase.co}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-sb_publishable_NZHoIxqqpSvVBP8MrLHCYA_gmg1AbN-}
          VITE_FIREFLIES_TABLE=${VITE_FIREFLIES_TABLE:-usr_nmexs7bytxq2_fireflies}
          EOF

      - name: Build
        run: npm run build

      - name: Add SPA-friendly 404
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
